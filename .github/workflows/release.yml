name: release

# Cut a release by pushing a v* tag.  ci.yml only runs on main and PRs, so every
# matrix job below also configures, builds and tests before packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  VER: ${{ github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            cc: gcc
            asset: cctxpack-linux-x86_64.tar.gz
            linkflags: -static
            osxarch: ""
          # One runner, one fat binary: covers Apple Silicon and Intel instead of
          # needing macos-13, whose Intel runner pool no longer schedules.
          - name: macos-universal
            os: macos-latest
            cc: clang
            asset: cctxpack-macos-universal.tar.gz
            linkflags: ""
            osxarch: "x86_64;arm64"
          - name: windows-x64
            os: windows-latest
            cc: cl
            asset: cctxpack-windows-x64.zip
            linkflags: ""
            osxarch: ""

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.linkflags }}"
          -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osxarch }}"
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage
        shell: bash
        run: |
          set -eu
          mkdir -p dist/pkg
          if [ -f "build/Release/cctxpack.exe" ]; then
            cp build/Release/cctxpack.exe dist/pkg/
          else
            cp build/cctxpack dist/pkg/
          fi
          cp LICENSE README.md docs/man1/cctxpack.1 dist/pkg/
          # Plain `strip`, no flags: the flag set differs between GNU strip and
          # Apple's, and `strip -s` / `strip all` both fail by treating the flag
          # as an input filename.
          if [ "${{ runner.os }}" != "Windows" ]; then
            strip dist/pkg/cctxpack || true
          fi
          ls -la dist/pkg

      - name: Package (tar)
        if: runner.os != 'Windows'
        shell: bash
        run: tar czf "dist/${{ matrix.asset }}" -C dist pkg

      - name: Package (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/pkg -DestinationPath "dist/${{ matrix.asset }}"

      - name: Show asset
        shell: bash
        run: ls -la dist/*.tar.gz dist/*.zip 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  build-mingw:
    name: windows-mingw
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: msys2 {0}
        run: cmake --build build

      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      # msys2 ships tar but not 7z, so the MinGW asset is a tarball too.
      - name: Stage and package
        shell: msys2 {0}
        run: |
          set -eu
          mkdir -p dist/pkg
          cp build/cctxpack.exe dist/pkg/
          cp LICENSE README.md docs/man1/cctxpack.1 dist/pkg/
          strip dist/pkg/cctxpack.exe || true
          cd dist && tar czf cctxpack-windows-x64-mingw.tar.gz pkg
          ls -la *.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: windows-mingw
          path: dist/cctxpack-windows-x64-mingw.tar.gz
          if-no-files-found: error

  release:
    name: publish
    needs: [build, build-mingw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          {
            echo "## cctxpack $VER"
            echo
            echo "Token-budgeted repo packer. Single binary, no runtime deps."
            echo
            echo "The macOS asset is a universal binary (x86_64 + arm64)."
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS\`."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            --title "cctxpack $VER" \
            --notes-file notes.md \
            *.tar.gz *.zip SHA256SUMS \
          || gh release upload "$TAG" *.tar.gz *.zip SHA256SUMS --clobber
          echo "--- published ---"
          gh release view "$TAG" --json url --jq .url
          gh release view "$TAG" --json assets --jq '.assets[].name'